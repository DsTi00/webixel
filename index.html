<!DOCTYPE html>

                                <path d="M4 12h10" />

                    </div>

                            <path d="M4 12h10" />
                            <path d="M12 19h8" />

                            <path d="M4 12h10" />
                            <path d="M12 19h8" />
                        </svg> Community
                    </p>
                    <div class="noto">

                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"

                                <path d="M12 19h8" />

                        </p>
                        <div class="nbg">

                            <path d="m6 9 6 6 6-6" />

                            <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                            <path
                                d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />

                        </div>
                        <div class=" imgDiv" style="position: relative;">
                            <img src="https://images.pexels.com/photos/33464097/pexels-photo-33464097.png"
                                alt="sara image" class="img"
                                style="height: 60px; width: 60px; border-radius: 100%; object-fit: cover; object-position: top;">
                            <div class="greenDot"
                                style="position: absolute; background-color: rgb(28, 199, 28); height: 10px; width: 10px; border-radius: 100%; right: 6px; top: 50px;">
